services:
  postgres:
    image: postgres:16-alpine
    container_name: scalability-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scalable_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scalable_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scalability-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: scalability-api
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      MODE: ${MODE:-optimized}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scalable_api
      PG_POOL_MAX: 10
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
